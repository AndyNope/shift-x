<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shift-X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <div id="app" class="max-w-4xl mx-auto p-4"></div>

    <script type="text/babel">
      const { useEffect, useState } = React;

      const api = async (path, method = 'GET', body) => {
        const res = await fetch(`/api/${path}`, {
          method,
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Fehler');
        return data;
      };

      function App() {
        const [user, setUser] = useState(null);
        const [message, setMessage] = useState('');
        const [pool, setPool] = useState([]);
        const [imported, setImported] = useState([]);

        const [registerForm, setRegisterForm] = useState({
          username: '', email: '', password: '', employee_number: '', swp_skill: 'NONE'
        });
        const [loginForm, setLoginForm] = useState({ email: '', password: '' });
        const [shiftForm, setShiftForm] = useState({ shift_date: '', start_time: '', end_time: '', provider: 'SWP', required_skill: 'FOERDERBAND' });
        const [dayListText, setDayListText] = useState('');

        const refresh = async () => {
          const me = await api('me.php');
          setUser(me.user);
          if (me.user) {
            const shifts = await api('shifts.php');
            setPool(shifts.shifts);
          }
        };

        useEffect(() => { refresh().catch(() => {}); }, []);

        const onRegister = async (e) => {
          e.preventDefault();
          await api('register.php', 'POST', registerForm);
          setMessage('Registrierung erfolgreich. Bitte einloggen.');
        };

        const onLogin = async (e) => {
          e.preventDefault();
          const data = await api('login.php', 'POST', loginForm);
          setUser(data.user);
          setMessage('Login erfolgreich.');
          await refresh();
        };

        const onCreateShift = async (e) => {
          e.preventDefault();
          await api('shifts.php', 'POST', shiftForm);
          setMessage('Schicht im Pool veröffentlicht.');
          await refresh();
        };

        const onClaim = async (id) => {
          await api('claim_shift.php', 'POST', { shift_id: id });
          setMessage('Schicht übernommen und Test-Mail versendet.');
          await refresh();
        };

        const onImport = async (e) => {
          e.preventDefault();
          const data = await api('import_day_list.php', 'POST', { text: dayListText });
          setImported(data.shifts);
        };

        const publishImported = async (shift) => {
          await api('shifts.php', 'POST', shift);
          setMessage('Import-Schicht veröffentlicht.');
          await refresh();
        };

        return (
          <div className="space-y-4">
            <h1 className="text-2xl font-bold">Shift-X</h1>
            {message && <div className="p-3 bg-emerald-100 border border-emerald-300 rounded">{message}</div>}

            {!user ? (
              <div className="grid md:grid-cols-2 gap-4">
                <form className="bg-white p-4 rounded shadow space-y-2" onSubmit={onRegister}>
                  <h2 className="font-semibold">Registrierung</h2>
                  <input className="w-full border p-2 rounded" placeholder="Benutzername" value={registerForm.username} onChange={(e) => setRegisterForm({ ...registerForm, username: e.target.value })} />
                  <input className="w-full border p-2 rounded" placeholder="E-Mail" type="email" value={registerForm.email} onChange={(e) => setRegisterForm({ ...registerForm, email: e.target.value })} />
                  <input className="w-full border p-2 rounded" placeholder="Passwort (min. 8)" type="password" value={registerForm.password} onChange={(e) => setRegisterForm({ ...registerForm, password: e.target.value })} />
                  <input className="w-full border p-2 rounded" placeholder="Swissport-Mitarbeiternummer" value={registerForm.employee_number} onChange={(e) => setRegisterForm({ ...registerForm, employee_number: e.target.value })} />
                  <select className="w-full border p-2 rounded" value={registerForm.swp_skill} onChange={(e) => setRegisterForm({ ...registerForm, swp_skill: e.target.value })}>
                    <option value="NONE">Keine</option>
                    <option value="FOERDERBAND">Förderband</option>
                    <option value="TREPPE">Treppe</option>
                    <option value="HT">HT</option>
                  </select>
                  <button className="bg-blue-600 text-white px-3 py-2 rounded">Registrieren</button>
                </form>

                <form className="bg-white p-4 rounded shadow space-y-2" onSubmit={onLogin}>
                  <h2 className="font-semibold">Login</h2>
                  <input className="w-full border p-2 rounded" placeholder="E-Mail" type="email" value={loginForm.email} onChange={(e) => setLoginForm({ ...loginForm, email: e.target.value })} />
                  <input className="w-full border p-2 rounded" placeholder="Passwort" type="password" value={loginForm.password} onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })} />
                  <button className="bg-slate-800 text-white px-3 py-2 rounded">Einloggen</button>
                </form>
              </div>
            ) : (
              <>
                <div className="bg-white p-4 rounded shadow flex items-center justify-between">
                  <div>Angemeldet als <strong>{user.username}</strong> ({user.employee_number}) · Skill: {user.swp_skill}</div>
                  <button className="text-sm text-red-600" onClick={async () => { await api('logout.php', 'POST'); setUser(null); setPool([]); }}>Logout</button>
                </div>

                <form className="bg-white p-4 rounded shadow grid md:grid-cols-5 gap-2" onSubmit={onCreateShift}>
                  <input className="border p-2 rounded" type="date" value={shiftForm.shift_date} onChange={(e) => setShiftForm({ ...shiftForm, shift_date: e.target.value })} />
                  <input className="border p-2 rounded" type="time" value={shiftForm.start_time} onChange={(e) => setShiftForm({ ...shiftForm, start_time: e.target.value })} />
                  <input className="border p-2 rounded" type="time" value={shiftForm.end_time} onChange={(e) => setShiftForm({ ...shiftForm, end_time: e.target.value })} />
                  <select className="border p-2 rounded" value={shiftForm.provider} onChange={(e) => setShiftForm({ ...shiftForm, provider: e.target.value })}>
                    <option value="SWP">SWP</option>
                    <option value="DNATA">DNATA</option>
                  </select>
                  <select className="border p-2 rounded" value={shiftForm.required_skill} onChange={(e) => setShiftForm({ ...shiftForm, required_skill: e.target.value })}>
                    <option value="FOERDERBAND">Förderband</option>
                    <option value="TREPPE">Treppe</option>
                    <option value="HT">HT</option>
                  </select>
                  <button className="md:col-span-5 bg-blue-600 text-white px-3 py-2 rounded">Schicht abgeben</button>
                </form>

                <div className="bg-white p-4 rounded shadow">
                  <h2 className="font-semibold mb-2">Schicht-Pool</h2>
                  <div className="space-y-2">
                    {pool.map((s) => (
                      <div key={s.id} className="border rounded p-3 flex flex-wrap items-center justify-between gap-2">
                        <div>{s.shift_date} · {s.start_time}-{s.end_time} · {s.provider} · {s.required_skill} · von {s.owner_name}</div>
                        <button className="bg-emerald-600 text-white px-3 py-1 rounded" onClick={() => onClaim(s.id)}>Übernehmen</button>
                      </div>
                    ))}
                    {pool.length === 0 && <div className="text-slate-500">Keine offenen Schichten.</div>}
                  </div>
                </div>

                <form className="bg-white p-4 rounded shadow space-y-2" onSubmit={onImport}>
                  <h2 className="font-semibold">Day List Import (Text/PDF-Auszug)</h2>
                  <textarea className="w-full border p-2 rounded h-40" placeholder="Day List Text hier einfügen" value={dayListText} onChange={(e) => setDayListText(e.target.value)} />
                  <button className="bg-slate-800 text-white px-3 py-2 rounded">Schichten auslesen</button>
                  <div className="space-y-2">
                    {imported.map((s, idx) => (
                      <div key={idx} className="border rounded p-2 flex justify-between items-center">
                        <div>{s.shift_date} · {s.start_time}-{s.end_time} · {s.provider} · {s.required_skill}</div>
                        <button type="button" className="bg-blue-600 text-white px-2 py-1 rounded" onClick={() => publishImported(s)}>Zum Pool</button>
                      </div>
                    ))}
                  </div>
                </form>
              </>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
  </body>
</html>
